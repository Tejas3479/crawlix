[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crawlix-client"
version = "1.0.0"
authors = [
  { name="Crawlix Team", email="team@crawlix.dev" },
]
description = "Official Python client for the Crawlix Web Scraping Engine"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "httpx>=0.24.0",
]

[project.urls]
"Homepage" = "https://github.com/Tejas3479/crawlix"
"Bug Tracker" = "https://github.com/Tejas3479/crawlix/issues"
