version: '3.8'

services:
  crawlix:
    build: .
    image: crawlix:latest
    container_name: crawlix_server
    ports:
      - "8000:8000"
    environment:
      - API_KEYS=mykey1,mykey2
      - MAX_PLAYWRIGHT_INSTANCES=3
      - SESSION_TTL_MINUTES=30
      - MAX_SESSIONS=100
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: crawlix_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  worker:
    build: .
    image: crawlix:latest
    container_name: crawlix_worker
    command: arq worker.WorkerSettings
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=sqlite+aiosqlite:///data/crawlix.db
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  redis_data:
