services:
  crawlix:
    build: .
    image: crawlix:latest
    container_name: crawlix_server
    ports:
      - "8000:8000"
    environment:
      - API_KEYS=${API_KEYS:-mykey1,mykey2}
      - ENV=${ENV:-development}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:8000}
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-60}
      - MAX_PLAYWRIGHT_INSTANCES=3
      - SESSION_TTL_MINUTES=30
      - MAX_SESSIONS=100
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://crawlix:crawlix@postgres:5432/crawlix
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-}
      - WEBHOOK_MAX_RETRIES=${WEBHOOK_MAX_RETRIES:-3}
      - CACHE_ENABLED=${CACHE_ENABLED:-true}
      - CACHE_TTL_SECONDS=${CACHE_TTL_SECONDS:-3600}
      - CAPTCHA_PROVIDER=${CAPTCHA_PROVIDER:-}
      - CAPTCHA_API_KEY=${CAPTCHA_API_KEY:-}
    volumes:
      - data_volume:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: crawlix_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: crawlix_postgres
    environment:
      POSTGRES_USER: crawlix
      POSTGRES_PASSWORD: crawlix
      POSTGRES_DB: crawlix
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crawlix"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  worker:
    build: .
    image: crawlix:latest
    container_name: crawlix_worker
    command: arq worker.WorkerSettings
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://crawlix:crawlix@postgres:5432/crawlix
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-}
      - WEBHOOK_MAX_RETRIES=${WEBHOOK_MAX_RETRIES:-3}
      - CACHE_ENABLED=${CACHE_ENABLED:-true}
      - CACHE_TTL_SECONDS=${CACHE_TTL_SECONDS:-3600}
      - CAPTCHA_PROVIDER=${CAPTCHA_PROVIDER:-}
      - CAPTCHA_API_KEY=${CAPTCHA_API_KEY:-}
    volumes:
      - data_volume:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

volumes:
  redis_data:
  postgres_data:
  data_volume: